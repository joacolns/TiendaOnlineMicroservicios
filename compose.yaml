services:
  csharp-usuariosservice:
    build:
      context: ./UsuariosService
      dockerfile: Dockerfile
    container_name: csharp-usuariosservice
    restart: unless-stopped
    ports:
      - "5001:80"
    depends_on:
      - mysql-usuarios
    networks:
      - tienda-network

  csharp-productosservice:
    build:
      context: ./ProductosService
      dockerfile: Dockerfile
    container_name: csharp-productosservice
    restart: unless-stopped
    ports:
      - "5002:90"
    depends_on:
      - mysql-productos
    networks:
      - tienda-network

  csharp-carritoservice:
    build:
      context: ./CarritoService
      dockerfile: Dockerfile
    container_name: csharp-carritoservice
    restart: unless-stopped
    ports:
      - "5003:5003"
    depends_on:
      - mysql-carrito
    networks:
      - tienda-network

  csharp-pagoservice:
    build:
      context: ./PagoService
      dockerfile: Dockerfile
    container_name: csharp-pagoservice
    restart: unless-stopped
    ports:
      - "5004:5004"
    depends_on:
      - mysql-pago
    networks:
      - tienda-network

  csharp-pedidosservice:
    build:
      context: ./PedidosService
      dockerfile: Dockerfile
    container_name: csharp-pedidosservice
    restart: unless-stopped
    ports:
      - "5005:5005"
    depends_on:
      - mysql-pedidos
    networks:
      - tienda-network

  mysql-usuarios:
    image: mysql:latest
    container_name: mysql-usuarios
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "2634"
      MYSQL_DATABASE: "usuarios_db"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "2634"
    ports:
      - "33061:3306"
    volumes:
      - usuarios-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tienda-network

  mysql-productos:
    image: mysql:latest
    container_name: mysql-productos
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "2634"
      MYSQL_DATABASE: "productos_db"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "2634"
    ports:
      - "33062:3306"
    volumes:
      - productos-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tienda-network

  mysql-carrito:
    image: mysql:latest
    container_name: mysql-carrito
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "2634"
      MYSQL_DATABASE: "carritosdb"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "2634"
    ports:
      - "33063:3306"
    volumes:
      - carrito-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tienda-network

  mysql-pago:
    image: mysql:latest
    container_name: mysql-pago
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "2634"
      MYSQL_DATABASE: "pagos_db"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "2634"
    ports:
      - "33064:3306"
    volumes:
      - pago-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tienda-network

  mysql-pedidos:
    image: mysql:latest
    container_name: mysql-pedidos
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "2634"
      MYSQL_DATABASE: "pedidos_db"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "2634"
    ports:
      - "33065:3306"
    volumes:
      - pedidos-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tienda-network

volumes:
  usuarios-db-data:
  productos-db-data:
  carrito-db-data:
  pago-db-data:
  pedidos-db-data:

networks:
  tienda-network:
    driver: bridge